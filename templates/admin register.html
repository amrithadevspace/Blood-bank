<!DOCTYPE html>
<html>
<head>
    <title>Blood Bank Administrator Registration</title>

    <style>

        *{
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container{
            width: 450px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px lightgray;
        }

        h2{
            text-align: center;
            color: darkred;
            margin-bottom: 25px;
        }

        label{
            display: block;
            font-weight: bold;
            margin-top: 15px;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid lightgray;
            border-radius: 5px;
        }

        .btn{
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: darkred;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover{
            background-color: red;
        }
        .home-btn{

    position:absolute;
    top:20px;
    left:20px;

    padding:10px 20px;
    background-color:darkred;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;

}

    </style>
</head>

<body>

<div class="container">

    <h2>admin Registration</h2>
<a href="/home">
    <button class="home-btn">Back Home</button>
</a>
    <form method="post">

        <label> Name</label>
        <input type="text"
               name="name"
               placeholder="Enter Blood Bank Name"
               required>


        <label>Location</label>
        <input type="text"
               name="location"
               placeholder="Enter Location"
               required>


        <label>Phone Number</label>
        <input type="text"
               name="phone"
               placeholder="Enter Phone Number"
               required>


        <label>Email</label>
        <input type="email"
               name="email"
               placeholder="Enter Email Address"
               required>

        <label>username</label>
        <input type="text"
               name="username"
               placeholder="Enter username"
               required>

 
        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>


        <input type="submit"
               value="Register"
               class="btn">

    </form>

</div>

</body>
</html>
