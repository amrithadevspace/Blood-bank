<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #ff4b5c, #ff6b6b);
        }

        .login-box{
            width: 350px;
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
        }

        .login-box h2{
            text-align: center;
            color: #c1121f;
            margin-bottom: 25px;
        }

        .input-box{
            margin-bottom: 20px;
        }

        .input-box label{
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .input-box input{
            width: 100%;
            padding: 10px;
            border: 1px solid lightgray;
            border-radius: 5px;
            outline: none;
        }

        .input-box input:focus{
            border-color: #c1121f;
        }

        .btn{
            width: 100%;
            padding: 12px;
            background-color: #c1121f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover{
            background-color: #9d0208;
        }

        .register{
            text-align: center;
            margin-top: 20px;
        }

        .register a{
            text-decoration: none;
            color: #c1121f;
            font-weight: bold;
        }

        .register a:hover{
            text-decoration: underline;
        }
         .home-btn{

    position:absolute;
    top:20px;
    left:20px;

    padding:10px 20px;
    background-color:darkred;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;

}

    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>
        <a href="/home">
    <button class="home-btn">Back Home</button>
</a>

        <form method='post'>

            <div class="input-box">
                <label>username</label>
                <input type="text" name="username" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

           <input type="submit" value="Login" class="btn">

</form>

{% if error %}
    <p style="color: red; text-align: center; margin-top: 15px; font-weight: bold;">
        {{ error }}
    </p>
{% endif %}

<div class="register">
    Don't have an account?
    <a href="/register">Register</a>
</div>

</body>
</html>
