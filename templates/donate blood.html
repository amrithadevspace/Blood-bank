<!DOCTYPE html>
<html>
<head>
    <title>Donate Blood</title>

    <style>

        *{
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color: #f4f4f4;
        }

        .container{
            width: 500px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px lightgray;
        }

        h2{
            text-align: center;
            color: darkred;
            margin-bottom: 25px;
        }

        label{
            display: block;
            font-weight: bold;
            margin-top: 15px;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid lightgray;
            border-radius: 5px;
        }

        .btn{
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: darkred;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover{
            background-color: red;
        }
         .home-btn{

    position:absolute;
    top:20px;
    left:20px;

    padding:10px 20px;
    background-color:darkred;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;

}

    </style>
</head>

<body>

<div class="container">

    <h2>Donate Blood</h2>

    <a href="/donor">
    <button class="home-btn">Back Home</button>
</a>

    <form method="post">

        <label>Last Donation Date</label>
        <input type="date" name="date" required>

        <label>Donation Place</label>
        <input type="text"
               name="place"
               placeholder="Enter Donation Place"
               required>
        <label>Hospital</label>
        <input type="text"
               name="hospital"
               placeholder="Enter Donation Place"
               required>
        <label>Patient name</label>
        <input type="text"
               name="recipient"
               placeholder="Enter Donation Place"
               required>
        <label>Blood Group</label>
        <input type="text"
               name="blood_group"
               placeholder="Enter Donation Place"
               required>
   <label for="quantity">Quantity (Units)</label>
<input type="number"
       id="quantity"
       name="quantity"
       placeholder="Enter quantity"
       min="1"
       step="1"
       required>
        <input type="submit"
               value="Submit"
               class="btn">

    </form>

</div>

</body>
</html>
