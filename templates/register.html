<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #ff4b5c, #ff6b6b);
        }

        .container{
            width: 400px;
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2{
            color: #c1121f;
            margin-bottom: 30px;
        }

        .btn{
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            background-color: #c1121f;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover{
            background-color: #9d0208;
        }

        a{
            text-decoration: none;
        }
         .home-btn{

    position:absolute;
    top:20px;
    left:20px;

    padding:10px 20px;
    background-color:darkred;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;

}

    </style>
</head>

<body>

    <div class="container">

        <h2>Select Your Role</h2>

        <a href="/donor_register">
            <button class="btn">Register as Donor</button>
        </a>

        <a href="/recipient_register">
            <button class="btn">Register as Recipient</button>
        </a>

        <a href="/admin_register">
            <button class="btn">Register as Blood Bank Admin</button>
        </a>

    </div>

</body>
</html>
