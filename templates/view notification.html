<!DOCTYPE html>
<html>

<head>

    <title>View Notifications</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background-color:#f4f4f4;
            min-height:100vh;
        }

        .container{
            width:85%;
            max-width:1000px;
            margin:50px auto;
        }


        /* TOP BAR */

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;

            margin-bottom:30px;
        }

        h2{
            color:darkred;
            font-size:28px;
        }


        /* BACK BUTTON */

        .dashboard-btn{
            padding:10px 20px;

            background-color:darkred;
            color:white;

            text-decoration:none;

            border-radius:7px;

            font-size:14px;
            font-weight:bold;

            transition:0.3s;
        }

        .dashboard-btn:hover{
            background-color:#a00000;
            transform:translateY(-2px);
        }


        /* NOTIFICATION CARD */

        .notification-card{

            background-color:white;

            padding:25px;

            margin-bottom:20px;

            border-left:7px solid darkred;

            border-radius:12px;

            box-shadow:0px 5px 18px rgba(0,0,0,0.08);

            transition:0.3s;
        }

        .notification-card:hover{

            transform:translateY(-4px);

            box-shadow:0px 8px 25px rgba(0,0,0,0.12);
        }


        /* TITLE */

        .card-header{

            margin-bottom:15px;
        }

        .card-header h3{

            color:darkred;

            font-size:20px;
        }


        /* DESCRIPTION */

        .notification-card p{

            color:#555;

            line-height:1.7;

            font-size:15px;
        }

        .notification-card strong{

            color:#333;
        }


        /* EMPTY MESSAGE */

        .no-notification{

            background:white;

            padding:40px;

            text-align:center;

            border-radius:12px;

            color:#777;

            box-shadow:0px 5px 18px rgba(0,0,0,0.08);
        }


        /* RESPONSIVE */

        @media(max-width:600px){

            .container{

                width:92%;

                margin:30px auto;
            }

            .top-bar{

                flex-direction:column;

                gap:15px;

                align-items:flex-start;
            }

            h2{

                font-size:24px;
            }

            .dashboard-btn{

                padding:9px 15px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- TOP BAR -->

    <div class="top-bar">

        <h2>Notifications</h2>

        <a href="/donor" class="dashboard-btn">
            ← Back to Dashboard
        </a>

    </div>


    <!-- NOTIFICATIONS -->

    {% if ob %}

        {% for notification in ob %}

        <div class="notification-card">


            <div class="card-header">

                <h3>
                    {{ notification[1] }}
                </h3>

            </div>


            <p>

                <strong>Description:</strong>

                <br>

                {{ notification[2] }}

            </p>


        </div>

        {% endfor %}


    {% else %}

        <div class="no-notification">

            <h3>No Notifications</h3>

            <p>
                There are no notifications available at the moment.
            </p>

        </div>

    {% endif %}


</div>


</body>

</html>
