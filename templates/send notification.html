<!DOCTYPE html>
<html>
<head>
    <title>Post Notification</title>

    <style>

        *{
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color: #f4f4f4;
        }

        .container{
            width: 500px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px lightgray;
        }

        h2{
            text-align: center;
            color: darkred;
            margin-bottom: 25px;
        }

        label{
            display: block;
            font-weight: bold;
            margin-top: 15px;
        }

        input, textarea{
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid lightgray;
            border-radius: 5px;
        }

        textarea{
            resize: none;
        }

        .btn{
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: darkred;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover{
            background-color: red;
        }
         .home-btn{

    position:absolute;
    top:20px;
    left:20px;

    padding:10px 20px;
    background-color:darkred;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;

}

    </style>
</head>

<body>

<div class="container">

    <h2>Post Notification</h2>
    
     <a href="/admin">
    <button class="home-btn">Back Home</button>
</a>

    <form method="post">

        <label>Title</label>
        <input type="text"
               name="title"
               placeholder="Enter Title"
               required>


        <label>Description</label>
        <textarea name="description"
                  rows="5"
                  placeholder="Enter Description"
                  required></textarea>


        <input type="submit"
               value="Send Notification"
               class="btn">

    </form>

</div>

</body>
</html>
